# Local development: publishes Postgres and allows monitoring private/homelab addresses.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  app:
    environment:
      NODE_ENV: development
      MONITOR_ALLOW_PRIVATE_NETWORKS: ${MONITOR_ALLOW_PRIVATE_NETWORKS:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  monitor-worker:
    environment:
      NODE_ENV: development
      MONITOR_ALLOW_PRIVATE_NETWORKS: ${MONITOR_ALLOW_PRIVATE_NETWORKS:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
